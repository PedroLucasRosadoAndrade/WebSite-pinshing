<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Entrar em sua conta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="card-box">

        <div class="ms-logo">
            <div class="ms-squares">
                <div class="sq-red"></div>
                <div class="sq-green"></div>
                <div class="sq-blue"></div>
                <div class="sq-yellow"></div>
            </div>
            Microsoft
        </div>

        <h2 class="card-title">Escolha uma conta</h2>

        <!-- FORM -->
        <form action="password.html" method="GET">

            <div class="account-option">
                <div class="account-icon">👤</div>

                <div>
                    <input style="font-size: 14px; font-weight: 600;" type="email" name="email"
                        placeholder="Digite seu email" autocomplete="email" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Avançar </button>

        </form>

        <div class="account-option" style="border-top: none; cursor: pointer;" onclick="usarOutraConta()">
            <div class="account-icon" style="border: none; font-size: 20px;">+</div>
            <div style="font-size: 14px;">Use outra conta</div>
        </div>

    </div>
    <script>
        function usarOutraConta() {
            const input = document.querySelector('input[name="email"]');

            input.value = "";   // limpa o campo
            input.focus();      // foca no campo

            // opcional: força o autocomplete aparecer
            input.click();
        }
    </script>
</body>

</html>
